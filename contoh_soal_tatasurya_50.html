<script>
    const pgData = [{"sub": "Sistem Tata Surya", "q": "Susunan benda-benda langit yang terdiri atas matahari dan planet-planet disebut...", "opt": ["Galaksi", "Tata surya", "Bima Sakti", "Alam semesta"], "ans": 1, "exp": "Tata surya adalah susunan benda-benda langit yang terdiri atas matahari dan planet-planet[cite: 11]."}, {"sub": "Planet", "q": "Ada berapakah jumlah planet dalam sistem tata surya kita menurut materi yang dipelajari?", "opt": ["Tujuh buah", "Delapan buah", "Sembilan buah", "Sepuluh buah"], "ans": 1, "exp": "Ada delapan buah planet dalam tata surya, yaitu Merkurius, Venus, Bumi, Mars, Yupiter, Saturnus, Uranus, dan Neptunus[cite: 11]."}, {"sub": "Planet", "q": "Planet yang mempunyai lintasan terdekat ke matahari adalah...", "opt": ["Bumi", "Venus", "Mars", "Merkurius"], "ans": 3, "exp": "Merkurius merupakan planet yang mempunyai lintasan terdekat ke matahari[cite: 11]."}, {"sub": "Planet", "q": "Planet manakah yang merupakan planet terbesar dalam keluarga tata surya kita?", "opt": ["Saturnus", "Yupiter", "Neptunus", "Uranus"], "ans": 1, "exp": "Yupiter merupakan planet terbesar dalam keluarga tata surya[cite: 11]."}, {"sub": "Karakteristik Planet", "q": "Planet tampak berkilau seperti bintang meskipun tidak memancarkan cahaya sendiri. Hal ini disebabkan karena planet...", "opt": ["Memiliki atmosfer yang terbakar", "Memantulkan cahaya matahari yang menyinari permukaannya", "Memancarkan energi listrik", "Menyerap cahaya bulan"], "ans": 1, "exp": "Planet tidak memancarkan cahaya sendiri, planet tampak berkilau karena memantulkan cahaya matahari yang menyinari permukaannya[cite: 11]."}, {"sub": "Gerakan Bumi", "q": "Perputaran bumi pada sumbunya/porosnya disebut...", "opt": ["Revolusi bumi", "Rotasi bumi", "Evolusi bumi", "Gravitasi bumi"], "ans": 1, "exp": "Perputaran bumi pada sumbunya disebut rotasi bumi[cite: 11]."}, {"sub": "Dampak Rotasi", "q": "Berikut ini yang merupakan salah satu akibat dari rotasi bumi adalah terjadinya...", "opt": ["Pergantian musim", "Fase-fase bulan", "Pergantian siang dan malam", "Tahun kabisat"], "ans": 2, "exp": "Rotasi bumi mengakibatkan gerak semu harian matahari, pergantian siang dan malam, serta perbedaan waktu[cite: 11]."}, {"sub": "Dampak Rotasi", "q": "Perbedaan waktu dari tempat-tempat yang berbeda derajat bujurnya merupakan akibat dari...", "opt": ["Rotasi bumi", "Revolusi bumi", "Rotasi bulan", "Revolusi bulan"], "ans": 0, "exp": "Rotasi bumi mengakibatkan perbedaan waktu dari tempat-tempat yang berbeda derajat bujurnya[cite: 11]."}, {"sub": "Dampak Rotasi", "q": "Matahari seolah-olah bergerak terbit dari timur dan tenggelam di barat setiap hari. Peristiwa ini disebut gerak semu harian matahari yang diakibatkan oleh...", "opt": ["Revolusi bumi", "Rotasi bumi", "Revolusi bulan", "Rotasi matahari"], "ans": 1, "exp": "Rotasi bumi mengakibatkan gerak semu harian matahari[cite: 11]."}, {"sub": "Gerakan Bumi", "q": "Gerakan bumi mengitari/mengelilingi matahari disebut...", "opt": ["Rotasi bumi", "Revolusi bumi", "Rotasi bulan", "Evolusi matahari"], "ans": 1, "exp": "Bumi berevolusi (mengelilingi) mengitari matahari[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Peredaran bumi mengelilingi matahari (revolusi bumi) dijadikan dasar untuk perhitungan...", "opt": ["Tahun Komariyah", "Tahun Hijriah", "Tahun Masehi", "Tahun Kabisat"], "ans": 2, "exp": "Peredaran bumi mengelilingi matahari (revolusi bumi) dijadikan dasar untuk perhitungan tahun Masehi[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Berapa lama waktu yang diperlukan bumi untuk satu kali mengelilingi matahari (satu tahun Masehi)?", "opt": ["354 hari", "360 hari", "365 hari", "366 hari"], "ans": 2, "exp": "Satu kali bumi mengelilingi matahari memerlukan waktu 365 hari[cite: 11]."}, {"sub": "Gerakan Bulan", "q": "Dalam peredarannya, bulan melakukan tiga gerakan sekaligus. Berikut ini yang BUKAN merupakan gerakan bulan adalah...", "opt": ["Berputar pada porosnya (Rotasi bulan)", "Mengitari bumi (Revolusi bulan)", "Bersama-sama bumi mengitari matahari", "Mengitari planet Mars"], "ans": 3, "exp": "Bulan melakukan tiga gerakan: berputar pada porosnya, berevolusi mengitari bumi, dan bersama-sama bumi mengitari matahari[cite: 11]."}, {"sub": "Dampak Gerak Bulan", "q": "Perbedaan bentuk permukaan bulan yang terang dari hari ke hari disebut fase-fase bulan. Fase-fase bulan ini diakibatkan oleh peristiwa...", "opt": ["Rotasi bumi", "Revolusi bumi", "Rotasi bulan", "Revolusi bulan"], "ans": 3, "exp": "Revolusi bulan mengakibatkan terjadinya fase-fase bulan[cite: 11]."}, {"sub": "Gerhana", "q": "Peristiwa yang terjadi apabila matahari, bumi, dan bulan berada pada satu garis lurus, dengan bumi berada di tengah adalah...", "opt": ["Gerhana matahari", "Gerhana bulan", "Fase bulan sabit", "Bulan purnama"], "ans": 1, "exp": "Gerhana bulan terjadi apabila matahari, bumi, dan bulan berada pada satu garis lurus, dengan bumi berada di antara matahari dan bulan[cite: 11]."}, {"sub": "Gerhana", "q": "Peristiwa yang terjadi apabila matahari, bulan, dan bumi berada pada satu garis lurus, dengan bulan berada di tengah adalah...", "opt": ["Gerhana bulan", "Fase bulan purnama", "Gerhana matahari", "Revolusi bulan"], "ans": 2, "exp": "Gerhana matahari terjadi apabila matahari, bulan, dan bumi berada pada satu garis lurus dengan bulan berada di antara matahari dan bumi[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Peredaran bulan mengelilingi bumi (revolusi bulan) dijadikan dasar untuk perhitungan tahun...", "opt": ["Masehi", "Syamsiah", "Hijriah atau Komariyah", "Kabisat"], "ans": 2, "exp": "Peredaran bulan mengelilingi bumi dijadikan dasar perhitungan tahun Hijriah atau tahun Komariyah[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Berapa lama periode revolusi bulan mengelilingi bumi yang dijadikan dasar perhitungan satu bulan Komariyah?", "opt": ["28 hari", "29 hari", "30 hari", "31 hari"], "ans": 1, "exp": "Periode revolusi bulan mengelilingi bumi selama 29 hari[cite: 11]."}, {"sub": "Istilah", "q": "Benda langit yang tidak mengeluarkan cahaya sendiri dan bergerak mengelilingi matahari disebut...", "opt": ["Bintang", "Komet", "Planet", "Meteor"], "ans": 2, "exp": "Planet adalah benda langit yang tidak mengeluarkan cahaya dan bergerak mengelilingi matahari[cite: 11]."}, {"sub": "Istilah", "q": "Benda langit yang bergerak mengelilingi planet disebut...", "opt": ["Bintang", "Satelit", "Komet", "Asteroid"], "ans": 1, "exp": "Satelit adalah benda yang bergerak mengelilingi planet. Contohnya adalah Bulan yang mengelilingi Bumi[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Tahun Kabisat adalah tahun yang jumlah harinya sebanyak...", "opt": ["354 hari", "364 hari", "365 hari", "366 hari"], "ans": 3, "exp": "Tahun Kabisat adalah tahun yang jumlah harinya 366 hari (jumlah hari di bulan Februari adalah 29)[cite: 11]."}, {"sub": "Istilah", "q": "Benda langit yang bergerak mengelilingi matahari dengan lintasan elips yang gepeng, tampak berekor cahaya ketika dekat dengan matahari disebut...", "opt": ["Satelit", "Planet", "Komet", "Meteor"], "ans": 2, "exp": "Komet adalah benda langit yang bergerak mengelilingi matahari dengan lintasan elips yang gepeng, tampak berekor cahaya ketika dekat dengan matahari[cite: 11]."}, {"sub": "Istilah", "q": "Benda langit yang bergerak dengan cepat di angkasa dan bila memasuki atmosfer bumi bagian luarnya terbakar sehingga seperti bintang jatuh disebut...", "opt": ["Komet", "Meteor", "Planet", "Satelit"], "ans": 1, "exp": "Meteor adalah benda langit yang bergerak dengan cepat di angkasa, bila memasuki atmosfer bumi akan terbakar seperti bintang jatuh[cite: 11]."}, {"sub": "Istilah", "q": "Bagian meteor yang tidak habis terbakar di atmosfer dan jatuh sampai ke permukaan bumi disebut...", "opt": ["Komet", "Meteorit", "Asteroid", "Debu kosmik"], "ans": 1, "exp": "Meteorit adalah bagian meteor yang tidak habis terbakar dan jatuh ke bumi[cite: 11]."}, {"sub": "Istilah", "q": "Bidang edar planet yang berupa bidang datar berbentuk bundar lonjong disebut...", "opt": ["Orbit", "Eliptika", "Galaksi", "Tata surya"], "ans": 1, "exp": "Eliptika adalah bidang edar planet yang berupa bidang datar berbentuk bundar lonjong[cite: 11]."}, {"sub": "Karakteristik Planet", "q": "Planet yang letaknya paling jauh dari Matahari dalam sistem tata surya kita adalah...", "opt": ["Mars", "Saturnus", "Uranus", "Neptunus"], "ans": 3, "exp": "Berdasarkan urutan planet (Merkurius, Venus, Bumi, Mars, Yupiter, Saturnus, Uranus, Neptunus), Neptunus adalah planet terjauh[cite: 11]."}, {"sub": "Dampak Rotasi", "q": "Saat belahan bumi bagian timur menghadap matahari, belahan bumi tersebut akan mengalami waktu...", "opt": ["Malam", "Siang", "Sore", "Fajar"], "ans": 1, "exp": "Akibat rotasi bumi, bagian bumi yang menghadap matahari mengalami siang, dan yang membelakangi mengalami malam[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Pada Tahun Kabisat, bulan manakah yang mengalami penambahan jumlah hari menjadi 29 hari?", "opt": ["Januari", "Februari", "Maret", "Desember"], "ans": 1, "exp": "Pada tahun Kabisat, jumlah hari di bulan Februari adalah 29[cite: 11]."}, {"sub": "Planet", "q": "Bumi berada di urutan ke berapa terdekat dari Matahari?", "opt": ["Pertama", "Kedua", "Ketiga", "Keempat"], "ans": 2, "exp": "Urutannya: 1. Merkurius, 2. Venus, 3. Bumi[cite: 11]."}, {"sub": "Gerhana", "q": "Mengapa pada saat gerhana matahari, sebagian daerah di bumi menjadi gelap meskipun pada siang hari?", "opt": ["Karena matahari kehilangan cahayanya", "Karena cahaya matahari terhalang oleh bumi", "Karena cahaya matahari terhalang oleh bulan", "Karena bulan memancarkan cahaya hitam"], "ans": 2, "exp": "Gerhana matahari terjadi saat bulan berada di antara matahari dan bumi, sehingga cahaya matahari terhalang oleh bulan dan menyebabkan bayangan gelap di bumi[cite: 11]."}, {"sub": "Istilah", "q": "Bintang jatuh yang sering kita lihat pada malam hari sebenarnya adalah peristiwa terbakarnya...", "opt": ["Komet", "Planet", "Satelit", "Meteor"], "ans": 3, "exp": "Meteor yang memasuki atmosfer bumi akan terbakar dan terlihat seperti bintang jatuh[cite: 11]."}, {"sub": "Planet", "q": "Dua planet yang letaknya berada di antara Bumi dan Matahari adalah...", "opt": ["Merkurius dan Mars", "Venus dan Mars", "Merkurius dan Venus", "Mars dan Yupiter"], "ans": 2, "exp": "Urutan planet: Merkurius, Venus, Bumi. Jadi sebelum Bumi ada Merkurius dan Venus[cite: 11]."}, {"sub": "Gerakan Bulan", "q": "Satu siklus penuh fase bulan (misalnya dari purnama ke purnama berikutnya) memakan waktu kira-kira...", "opt": ["7 hari", "14 hari", "29 hari", "365 hari"], "ans": 2, "exp": "Periode revolusi bulan (yang menyebabkan fase bulan) adalah selama 29 hari[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Tahun komariyah atau tahun hijriah sangat bergantung pada penampakan/pergerakan...", "opt": ["Matahari", "Bintang", "Komet", "Bulan"], "ans": 3, "exp": "Tahun Komariyah dihitung berdasarkan peredaran bulan mengelilingi bumi[cite: 11]."}, {"sub": "Gerhana", "q": "Gerhana bulan biasanya terjadi pada saat fase bulan...", "opt": ["Bulan baru", "Bulan sabit", "Bulan separuh", "Bulan purnama"], "ans": 3, "exp": "Meskipun tidak secara eksplisit di teks ringkas, secara logika sains saat matahari-bumi-bulan segaris, dari bumi, sisi bulan yang menghadap bumi sepenuhnya diterangi matahari sebelum masuk bayangan bumi (fase purnama). Hal ini menguatkan konsep posisi segaris[cite: 11]."}, {"sub": "Karakteristik Planet", "q": "Jika kita mengamati planet di langit malam, cahayanya tampak tenang dan tidak berkelap-kelip seperti bintang. Hal ini karena...", "opt": ["Planet sangat panas", "Planet memantulkan cahaya matahari", "Planet sangat kecil", "Planet bergerak sangat cepat"], "ans": 1, "exp": "Planet tampak berkilau karena memantulkan cahaya matahari, bukan memancarkan cahaya sendiri seperti bintang yang cahayanya berkedip[cite: 11]."}, {"sub": "Planet", "q": "Setelah planet Mars, planet berikutnya yang paling besar di tata surya adalah...", "opt": ["Saturnus", "Yupiter", "Uranus", "Bumi"], "ans": 1, "exp": "Urutannya: Mars, Yupiter. Yupiter merupakan planet terbesar[cite: 11]."}, {"sub": "Dampak Rotasi", "q": "Adanya wilayah Indonesia yang memiliki Waktu Indonesia Barat (WIB), Tengah (WITA), dan Timur (WIT) merupakan bukti nyata dari akibat...", "opt": ["Rotasi bumi", "Revolusi bumi", "Revolusi bulan", "Gerhana"], "ans": 0, "exp": "Rotasi bumi mengakibatkan perbedaan waktu dari tempat-tempat yang berbeda derajat bujurnya[cite: 11]."}, {"sub": "Istilah", "q": "Susunan benda langit yang terdiri atas matahari dan planet-planet disebut tata surya. Apa pusat dari sistem tata surya kita?", "opt": ["Bumi", "Bulan", "Yupiter", "Matahari"], "ans": 3, "exp": "Tata surya terdiri atas matahari dan planet-planet, di mana matahari adalah pusat dan planet berevolusi mengitarinya[cite: 11]."}, {"sub": "Istilah", "q": "Perputaran planet mengelilingi matahari disebut...", "opt": ["Rotasi", "Revolusi", "Evolusi", "Eliptika"], "ans": 1, "exp": "Revolusi adalah perputaran planet mengelilingi matahari[cite: 11]."}, {"sub": "Komet", "q": "Ciri khas komet saat bergerak mendekati matahari adalah...", "opt": ["Ukurannya mengecil", "Tampak berekor cahaya", "Cahayanya meredup", "Berubah menjadi meteor"], "ans": 1, "exp": "Komet tampak berekor cahaya ketika dekat dengan matahari[cite: 11]."}, {"sub": "Planet", "q": "Planet-planet tetap berada pada lintasan eliptikanya saat mengelilingi matahari. Lintasan ini juga disebut...", "opt": ["Sumbu", "Poros", "Satelit", "Bidang edar"], "ans": 3, "exp": "Eliptika adalah bidang edar planet[cite: 11]."}, {"sub": "Gerakan Bumi", "q": "Gerakan yang menyebabkan terjadinya gerak semu harian matahari dari timur ke barat adalah gerakan bumi berputar dari arah...", "opt": ["Timur ke barat", "Barat ke timur", "Utara ke selatan", "Selatan ke utara"], "ans": 1, "exp": "Rotasi bumi mengakibatkan gerak semu harian matahari. Bumi berotasi dari barat ke timur sehingga matahari tampak terbit di timur[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Satu tahun Komariyah (12 bulan putaran bulan) jumlah harinya lebih sedikit dibandingkan satu tahun Masehi. Berapakah jumlah hari dalam satu bulan putaran bulan?", "opt": ["28 hari", "29 hari", "30 hari", "31 hari"], "ans": 1, "exp": "Periode revolusi bulan mengelilingi bumi adalah selama 29 hari[cite: 11]."}, {"sub": "Satelit", "q": "Benda langit apakah yang merupakan satelit alami bagi bumi?", "opt": ["Matahari", "Komet Halley", "Bintang", "Bulan"], "ans": 3, "exp": "Satelit adalah benda yang bergerak mengelilingi planet, dan bulan mengitari bumi[cite: 11]."}, {"sub": "Dampak Gerak Bulan", "q": "Fase bulan dari bulan baru, sabit, separuh, purnama, dan kembali lagi menjadi bulan baru terjadi karena...", "opt": ["Rotasi bulan", "Bulan memantulkan cahaya bumi", "Revolusi bulan mengelilingi bumi", "Gerhana bulan sebagian"], "ans": 2, "exp": "Revolusi bulan mengakibatkan terjadinya fase-fase bulan[cite: 11]."}, {"sub": "Gerhana", "q": "Bumi terletak di antara matahari dan bulan. Bayangan bumi menutupi bulan. Peristiwa ini disebut...", "opt": ["Gerhana matahari total", "Gerhana bulan", "Bulan purnama", "Fase bulan sabit"], "ans": 1, "exp": "Gerhana bulan terjadi apabila matahari, bumi, dan bulan berada pada satu garis lurus, dengan bumi berada di antara matahari dan bulan[cite: 11]."}, {"sub": "Planet", "q": "Selain Bumi, planet manakah yang letaknya lebih jauh dari Matahari dibandingkan dengan Mars?", "opt": ["Merkurius", "Venus", "Yupiter", "Tidak ada"], "ans": 2, "exp": "Yupiter letaknya lebih jauh dari matahari dibandingkan Mars dalam urutan tata surya[cite: 11]."}, {"sub": "Sistem Penanggalan", "q": "Tahun kabisat terjadi setiap empat tahun sekali untuk menyesuaikan perhitungan revolusi bumi yang sebenarnya. Pada tahun kabisat, bumi mengelilingi matahari dihitung selama...", "opt": ["365 hari", "365,25 hari", "366 hari", "364 hari"], "ans": 2, "exp": "Tahun Kabisat adalah tahun yang jumlah harinya 366 hari[cite: 11]."}, {"sub": "Istilah", "q": "Meteorit sering dipelajari oleh para ilmuwan karena...", "opt": ["Menghasilkan cahaya", "Merupakan bagian dari matahari", "Tidak habis terbakar dan jatuh sampai ke bumi", "Bisa digunakan untuk penanggalan"], "ans": 2, "exp": "Meteorit adalah bagian meteor yang tidak habis terbakar dan jatuh ke bumi, sehingga wujud fisiknya bisa dipelajari[cite: 11]."}];
